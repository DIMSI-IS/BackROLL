name: Manage release

# Not started by a release any more: creating a release (a beta, for instance) must not build and push Docker images.
# To publish the images of a version, run this workflow by hand (Actions > Manage release > Run workflow) and give the
# name of the tag, once it is decided how the releases are published.
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Name of the tag (and of the release) to publish, for example v1.1.0"
        required: true

jobs:
  manage-docker-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Backroll core Docker image
        run: docker build ./src/core --tag dimsicloud/backroll:${{ inputs.tag_name }}
      - name: Build Backroll UI Docker image
        run: docker build ./src/ui --tag dimsicloud/backroll-ui:${{ inputs.tag_name }}

      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Backroll core image
        run: docker push dimsicloud/backroll:${{ inputs.tag_name }}
      - name: Push Backroll UI image
        run: docker push dimsicloud/backroll-ui:${{ inputs.tag_name }}

  manage-quickstart:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Make quickstart.sh
        run: (cd release && bash make_quickstart.sh)
      - name: Upload quickstart.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ inputs.tag_name }} release/quickstart.sh
