services:

  database:
    restart: unless-stopped
  
  redis:
    restart: unless-stopped

  api:
    restart: unless-stopped
  
  worker_primary:
    restart: unless-stopped

  worker_secondary:
    restart: unless-stopped

  flower:
    restart: unless-stopped
    ports:
      # Flower has no login: only this machine reaches it, others use an SSH tunnel.
      - 127.0.0.1:5555:5555

  beat:
    restart: unless-stopped

  front:
    restart: unless-stopped
