# The addresses of the containers are resolved at each request (resolver of Docker), not once at the start of nginx:
# when the API or the front is recreated it gets another address, and nginx would keep sending to the old one.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    listen [::]:80;

    location /api {
        # Not the client header, which could be spoofed. Read by the audit log.
        proxy_set_header X-Forwarded-For $remote_addr;
        # With a variable and no path, the address of the request (with its query) is sent as it is.
        set $api_upstream http://api:5050;
        proxy_pass $api_upstream;
    }

    location / {
        set $front_upstream http://front:8080;
        proxy_pass $front_upstream;
    }
}
